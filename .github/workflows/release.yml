name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # setup-node writes `_authToken=${NODE_AUTH_TOKEN}` to ~/.npmrc.
      # With OIDC we have no token env, so the line becomes empty and npm
      # sends an empty bearer instead of letting OIDC take over. Strip it.
      - run: npm config delete //registry.npmjs.org/:_authToken --location user || true
      - run: npm publish --access public --provenance
      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          generate_release_notes: true
